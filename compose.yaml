services:
  web:
    image: nginx:1.27-alpine
    container_name: stammbaum-web
    restart: unless-stopped
    networks:
      - platform_proxy
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  platform_proxy:
    external: true
