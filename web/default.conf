server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # JS/CSS revalidieren wie HTML — App ändert sich häufig, Browser-Cache würde
    # Deploys unsichtbar machen (siehe Login-Bug Nov 2026). Bilder/Fonts bleiben
    # langzeitgecached.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(jpe?g|png|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
