<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stammbaum</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<header>
  <h1>Stammbaum</h1>
  <nav>
    <span id="role-badge" class="role-badge" hidden></span>
    <button id="btn-add-person" data-editor hidden>+ Person</button>
    <button id="btn-add-edge" data-editor hidden>+ Beziehung</button>
    <button id="btn-import-gedcom" data-editor hidden>⬆ GEDCOM</button>
    <button id="btn-reload" hidden>↻</button>
    <button id="btn-logout" hidden>Logout</button>
  </nav>
</header>

<main hidden id="app-main">
  <aside id="list-panel">
    <input id="search" placeholder="Suchen…" autocomplete="off">
    <ul id="person-list"></ul>
  </aside>

  <section id="tree-panel">
    <svg id="tree" xmlns="http://www.w3.org/2000/svg"></svg>
  </section>

  <aside id="detail-panel">
    <div id="detail-empty">Keine Person ausgewählt.</div>
    <div id="detail" hidden></div>
  </aside>
</main>

<dialog id="login-dialog">
  <form method="dialog" id="login-form">
    <h2>Anmelden</h2>
    <label>Rolle
      <select name="role">
        <option value="editor">Editor (Vollzugriff)</option>
        <option value="viewer">Viewer (nur Lesen)</option>
      </select>
    </label>
    <label>PIN
      <input name="pin" type="password" autocomplete="current-password" required autofocus>
    </label>
    <div id="login-error" class="login-error" hidden></div>
    <menu>
      <button type="submit">Anmelden</button>
    </menu>
  </form>
</dialog>

<dialog id="person-dialog">
  <form method="dialog" id="person-form">
    <h2 id="person-dialog-title">Person</h2>
    <label>Vorname <input name="given_name" maxlength="200"></label>
    <label>Nachname <input name="surname" maxlength="200"></label>
    <label>Geburtsname <input name="birth_name" maxlength="200"></label>
    <label>Geschlecht
      <select name="gender">
        <option value="">—</option>
        <option value="m">männlich</option>
        <option value="f">weiblich</option>
        <option value="x">divers</option>
      </select>
    </label>
    <label>Geburt <input name="birth_date" placeholder="JJJJ-MM-TT oder frei"></label>
    <label>Geburtsort <input name="birth_place"></label>
    <label>Tod <input name="death_date" placeholder="JJJJ-MM-TT oder frei"></label>
    <label>Sterbeort <input name="death_place"></label>
    <label>Notizen <textarea name="notes" rows="3" maxlength="500"></textarea></label>
    <menu>
      <button type="button" data-close>Abbrechen</button>
      <button type="submit">Speichern</button>
    </menu>
  </form>
</dialog>

<dialog id="edge-dialog">
  <form method="dialog" id="edge-form">
    <h2>Beziehung anlegen</h2>
    <label>Typ
      <select name="type">
        <option value="parent">Elternteil → Kind</option>
        <option value="spouse">Ehepartner (beidseitig)</option>
      </select>
    </label>
    <label>Von <select name="from_id"></select></label>
    <label>Zu  <select name="to_id"></select></label>
    <menu>
      <button type="button" data-close>Abbrechen</button>
      <button type="submit">Speichern</button>
    </menu>
  </form>
</dialog>

<dialog id="import-dialog">
  <form method="dialog" id="import-form">
    <h2>GEDCOM importieren</h2>
    <p class="meta">Standardformat aus Ancestry, MyHeritage, Gramps, GEDitCOM. Max 2 MB. Personen und Beziehungen werden mit neuen IDs angelegt — kein Merge mit bestehenden Einträgen.</p>
    <label>Datei <input name="file" type="file" accept=".ged,.gedcom,text/plain" required></label>
    <div id="import-status" class="meta" hidden></div>
    <menu>
      <button type="button" data-close>Abbrechen</button>
      <button type="submit">Importieren</button>
    </menu>
  </form>
</dialog>

<script src="stammbaum.js?v=3" defer></script>
</body>
</html>
